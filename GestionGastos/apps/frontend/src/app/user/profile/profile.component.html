<div class="container">
  <h2>Mi perfil</h2>
  <ng-container *ngIf="usuario">
    <p><strong>Nombre:</strong> {{ usuario.nombre }}</p>
    <p><strong>Email:</strong> {{ usuario.email }}</p>
    <p><strong>Rol:</strong> {{ usuario.role }}</p>
    <p><strong>Miembro desde:</strong> {{ usuario.createdAt | date: 'medium' }}</p>
  </ng-container>
</div>
